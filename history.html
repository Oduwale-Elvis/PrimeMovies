<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeMovies | Recently Viewed</title>

    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="watchlist.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body>

<header class="navbar">

    <a href="index.html" class="logo">
        PRIME<span>MOVIES</span>
    </a>

    <a href="index.html" class="back-btn">
        ← Back Home
    </a>

</header>

<section class="watchlist-section">

    <div class="watchlist-header">

        <h1>🕒 Recently Viewed</h1>

        <button id="clearHistoryBtn">
            Clear History
        </button>

    </div>

    <div class="watchlist-grid" id="historyGrid"></div>

    <div id="emptyHistory" class="empty-message">

        <div class="empty-icon">🎬</div>

        <h2>No Recently Viewed Content</h2>

        <p>
            Movies, TV Shows and Anime you open
            will appear here.
        </p>

        <a href="index.html" class="browse-btn">
            Browse Content
        </a>

    </div>
    
</section>

<script type="module" src="history.js"></script>

</body>
</html>

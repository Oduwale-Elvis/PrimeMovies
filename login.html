<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Movies | Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1 class="brand">PRIME MOVIES</h1>
            <h2>Sign In</h2>
            <p class="subtitle">Login to continue watching</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group password-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                    <div class="eye-container">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </div>
                </div>

                <div class="option">
                    <label class="remember">
                        <input type="checkbox">Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Sign In</button>
                <div class="social-login">
                    <button type="button" class="social-btn google" id="googleLogin">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                        Continue with Google
                    </button>
                </div>    
                <p class="signup-text">
                    New to Prime Movies? <a href="#">Sign up now</a>
                </p>
            </form>
        </div>
    </div>

   <script type="module" src="login.js"></script>
</body>
</html>
